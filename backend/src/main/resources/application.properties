spring.datasource.url=${WORKSPACE_DB_URL}
spring.datasource.username=${WORKSPACE_DB_USER}
spring.datasource.password=${WORKSPACE_DB_PASSWORD}
spring.flyway.enabled=true
spring.jackson.deserialization.accept-float-as-int=false
spring.application.name=collaborative-workspace
logging.structured.format.console=ecs
# No environment, configuration, logfile, heap dump or session endpoints.
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
# HTTP route tags can contain user-controlled/unmatched paths. Export only our bounded stage metrics.
management.metrics.enable.http.server.requests=false
